<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Square Root Renderer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 4vw 2vw;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    .input-row {
      display: flex;
      width: 100%;
      gap: 1vw;
    }

    input {
      flex: 1;
      min-width: 0;

      padding: 1.2vw 1.5vw;

      font-family: Arial, sans-serif;
      font-size: 2.5vw;

      border: 0.1vw solid #cccccc;
      border-radius: 0.5vw;

      outline: none;
    }

    button {
      padding: 1.2vw 2vw;

      font-family: Arial, sans-serif;
      font-size: 2.5vw;

      border: none;
      border-radius: 0.5vw;

      background: #000000;
      color: #ffffff;

      cursor: pointer;
    }

    .result {
      margin-top: 4vw;

      width: 100%;
      min-height: 10vw;

      padding: 3vw;

      border: 0.1vw solid #cccccc;
      border-radius: 0.8vw;

      overflow-x: auto;
    }

    .output {
      display: block;
      min-height: 5vw;
    }

    .root-svg {
      display: block;
      height: 5.2vw;
      overflow: visible;
    }
  </style>
</head>

<body>

  <div class="input-row">

    <input
      id="inputText"
      type="text"
      placeholder="Enter something..."
    >

    <button id="submitButton">
      Submit
    </button>

  </div>


  <div
    class="result"
    id="result"
  >
    <div
      class="output"
      id="output"
    ></div>
  </div>


  <script>

    const input =
      document.getElementById("inputText");

    const button =
      document.getElementById("submitButton");

    const output =
      document.getElementById("output");


    function escapeHTML(text) {

      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }


    function underRoot(text) {

      const safeText =
        escapeHTML(text);

      const fontSize =
        window.innerWidth * 0.025;

      const canvas =
        document.createElement("canvas");

      const context =
        canvas.getContext("2d");

      context.font =
        `400 ${fontSize}px Arial`;

      const textWidthPx =
        context.measureText(text).width;

      const rootWidthPx =
        fontSize * 0.95;

      const textStartPx =
        rootWidthPx + (fontSize * 0.18);

      const svgWidthPx =
        textStartPx + textWidthPx + (fontSize * 0.2);

      const viewHeight =
        100;

      const viewWidth =
        (svgWidthPx / (fontSize * 2.08)) * viewHeight;

      const textStart =
        (textStartPx / svgWidthPx) * viewWidth;

      const textWidth =
        (textWidthPx / svgWidthPx) * viewWidth;

      const barEnd =
        textStart + textWidth + 2;


      return `
        <svg
          class="root-svg"
          viewBox="0 0 ${viewWidth} ${viewHeight}"
          width="${(svgWidthPx / window.innerWidth) * 100}vw"
          aria-label="square root of ${safeText}"
          role="img"
        >
          <path
            d="M 6 60 L 20 82 L 38 14 L ${barEnd} 14"
            fill="none"
            stroke="#000000"
            stroke-width="4.5"
            stroke-linecap="square"
            stroke-linejoin="miter"
          />
          <text
            x="${textStart}"
            y="74"
            font-family="Arial, sans-serif"
            font-size="48"
            font-weight="400"
            fill="#000000"
          >${safeText}</text>
        </svg>
      `;
    }


    function renderSquareRoot() {

      const value =
        input.value.trim();


      output.innerHTML =
        value ? underRoot(value) : "";
    }


    /*
     * Render when Submit is clicked.
     */
    button.addEventListener(
      "click",
      renderSquareRoot
    );


    /*
     * Render when Enter is pressed.
     */
    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          renderSquareRoot();
        }

      }
    );


    window.addEventListener(
      "resize",
      function() {

        if (input.value.trim()) {
          renderSquareRoot();
        }

      }
    );
  </script>

</body>
</html>
