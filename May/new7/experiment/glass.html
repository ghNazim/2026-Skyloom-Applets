<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Water Glass</title>
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #0b1a26;
    font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .main-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    width: 60vw;
    height: 40vw;
    max-width: 900px;
    max-height: 600px;
    min-width: 300px;
    min-height: 200px;
    position: relative;
  }

  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  svg text {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    user-select: none;
  }

  .slider-wrapper {
    width: 60vw;
    max-width: 600px;
    margin-top: 30px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 8px;
    background: #1d3f54;
    border-radius: 5px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #f7a01d;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    transition: transform 0.1s;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }

  input[type="range"]::-moz-range-thumb {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #f7a01d;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    border: none;
    transition: transform 0.1s;
  }

  input[type="range"]::-moz-range-thumb:hover {
    transform: scale(1.15);
  }
</style>
</head>
<body>

<div class="main-wrapper">
  <div class="container">
    <svg viewBox="0 0 600 450">
      <defs>
        <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#3b90b8"/>
          <stop offset="50%" stop-color="#4fa5c9"/>
          <stop offset="100%" stop-color="#3789b0"/>
        </linearGradient>
        <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#7bc7e6"/>
          <stop offset="100%" stop-color="#55accf"/>
        </linearGradient>
      </defs>

      <!-- Glass Back Tint -->
      <path d="M 110 100 A 140 30 0 0 0 390 100 L 350 420 A 100 20 0 0 1 150 420 Z" fill="#62b5df" opacity="0.05"/>
      <path d="M 110 100 A 140 30 0 0 1 390 100 L 350 420 A 100 20 0 0 0 150 420 Z" fill="#62b5df" opacity="0.05"/>

      <!-- Back Bottom Rims -->
      <path d="M 156 400 A 94 17 0 0 1 344 400" fill="none" stroke="#8acae9" stroke-width="2" opacity="0.3"/>
      <path d="M 150 420 A 100 20 0 0 1 350 420" fill="none" stroke="#62b5df" stroke-width="2" opacity="0.5"/>

      <!-- Back Top Rims -->
      <path d="M 110 100 A 140 30 0 0 1 390 100" fill="none" stroke="#62b5df" stroke-width="4"/>
      <path d="M 120 100 A 130 25 0 0 1 380 100" fill="none" stroke="#8acae9" stroke-width="2"/>

      <!-- Water Group -->
      <g id="water-group">
        <path id="water-body" fill="url(#waterGrad)" opacity="0.85"/>
        <ellipse id="water-surface" cx="250" fill="url(#surfaceGrad)" opacity="0.95"/>
        <ellipse id="water-surface-highlight" cx="250" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
      </g>

      <!-- Glass Base Volume (Inside thickness) -->
      <path d="M 156 400 A 94 17 0 0 0 344 400 L 350 420 A 100 20 0 0 1 150 420 Z" fill="#62b5df" opacity="0.15"/>
      <ellipse cx="250" cy="407" rx="97" ry="18.5" fill="none" stroke="#62b5df" stroke-width="2" opacity="0.4"/>
      <ellipse cx="250" cy="414" rx="98.5" ry="19.5" fill="none" stroke="#62b5df" stroke-width="2" opacity="0.4"/>

      <!-- Front Bottom Rims -->
      <path d="M 150 420 A 100 20 0 0 0 350 420" fill="none" stroke="#62b5df" stroke-width="4" stroke-linecap="round"/>
      <path d="M 156 400 A 94 17 0 0 0 344 400" fill="none" stroke="#8acae9" stroke-width="2" stroke-linecap="round"/>

      <!-- Side Walls -->
      <path d="M 110 100 L 150 420" fill="none" stroke="#62b5df" stroke-width="4" stroke-linecap="round"/>
      <path d="M 390 100 L 350 420" fill="none" stroke="#62b5df" stroke-width="4" stroke-linecap="round"/>
      <path d="M 120 100 L 156 400" fill="none" stroke="#8acae9" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <path d="M 380 100 L 344 400" fill="none" stroke="#8acae9" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

      <!-- Reflections overlay -->
      <path d="M 116 115 L 156 405" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.15"/>
      <path d="M 124 125 L 161 390" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.1"/>
      <path d="M 384 115 L 344 405" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.08"/>

      <!-- Front Top Rims -->
      <path d="M 110 100 A 140 30 0 0 0 390 100" fill="none" stroke="#62b5df" stroke-width="4"/>
      <path d="M 120 100 A 130 25 0 0 0 380 100" fill="none" stroke="#8acae9" stroke-width="2"/>

      <!-- Meter Base -->
      <line x1="450" y1="115" x2="450" y2="400" stroke="#1d3f54" stroke-width="4" stroke-linecap="round"/>
      <line id="meter-active" x1="450" y1="255" x2="450" y2="400" stroke="#62b5df" stroke-width="4" stroke-linecap="round"/>
      
      <text x="468" y="90" fill="#ffffff" font-size="20" font-weight="bold">cup</text>

      <!-- Ticks and Labels -->
      <g class="ticks">
        <line x1="450" y1="115" x2="470" y2="115" stroke="#62b5df" stroke-width="2"/>
        <text id="lbl-100" x="480" y="121" fill="#ffffff" font-size="20">1</text>
        
        <line x1="450" y1="257.5" x2="465" y2="257.5" stroke="#62b5df" stroke-width="2"/>
        <text id="lbl-50" x="480" y="263.5" fill="#ffffff" font-size="18">½</text>
        
        <line x1="450" y1="305" x2="465" y2="305" stroke="#62b5df" stroke-width="2"/>
        <text id="lbl-33" x="480" y="311" fill="#ffffff" font-size="18">⅓</text>
        
        <line x1="450" y1="328.8" x2="465" y2="328.8" stroke="#62b5df" stroke-width="2"/>
        <text id="lbl-25" x="480" y="334.8" fill="#ffffff" font-size="18">¼</text>
        
        <line x1="450" y1="400" x2="470" y2="400" stroke="#62b5df" stroke-width="2"/>
        <text id="lbl-0" x="480" y="406" fill="#ffffff" font-size="20">0</text>
      </g>

      <!-- Guess Indicator -->
      <g id="guess-group">
        <text id="guess-text" x="90" y="255" fill="#f7a01d" font-size="22" font-weight="bold" text-anchor="end" dominant-baseline="central">guess</text>
        <line id="guess-line" x1="100" y1="255" x2="160" y2="255" stroke="#f7a01d" stroke-width="2" stroke-dasharray="4 4"/>
      </g>

    </svg>
  </div>
  
  <div class="slider-wrapper">
    <input type="range" id="water-slider" min="0" max="1" step="0.001" value="0.25">
  </div>
</div>

<script>
  const slider = document.getElementById('water-slider');
  const waterBody = document.getElementById('water-body');
  const waterSurface = document.getElementById('water-surface');
  const waterSurfaceHighlight = document.getElementById('water-surface-highlight');
  const meterActive = document.getElementById('meter-active');
  const guessText = document.getElementById('guess-text');
  const guessLine = document.getElementById('guess-line');

  const ticks = [
    { val: 0, el: document.getElementById('lbl-0') },
    { val: 0.25, el: document.getElementById('lbl-25') },
    { val: 0.333, el: document.getElementById('lbl-33') },
    { val: 0.5, el: document.getElementById('lbl-50') },
    { val: 1, el: document.getElementById('lbl-100') }
  ];

  function updateWater(fillRatio) {
    fillRatio = Math.max(0, Math.min(1, fillRatio));

    // Map fill ratio to the physical dimensions of the glass
    const topY = 115;
    const bottomY = 400;
    const heightRange = bottomY - topY;
    
    // Y goes from 400 (0) to 115 (1)
    const waterY = bottomY - fillRatio * heightRange;
    
    // rx goes from 94 (0) to 128.2 (1) using linear interpolation
    const waterRx = 94 + fillRatio * 34.2;
    // ry goes from 17 (0) to 24.6 (1)
    const waterRy = 17 + fillRatio * 7.6;
    
    // Draw the water volume using SVG arc for the top back, and bottom front
    const path = `M ${250 - waterRx} ${waterY}
                  A ${waterRx} ${waterRy} 0 0 1 ${250 + waterRx} ${waterY}
                  L 344 400
                  A 94 17 0 0 1 156 400
                  Z`;
    
    if (fillRatio <= 0.005) {
      waterBody.setAttribute('opacity', '0');
      waterSurface.setAttribute('opacity', '0');
      waterSurfaceHighlight.setAttribute('opacity', '0');
    } else {
      waterBody.setAttribute('opacity', '0.85');
      waterSurface.setAttribute('opacity', '0.95');
      waterSurfaceHighlight.setAttribute('opacity', '0.4');
      
      waterBody.setAttribute('d', path);
      waterSurface.setAttribute('cy', waterY);
      waterSurface.setAttribute('rx', waterRx);
      waterSurface.setAttribute('ry', waterRy);
      
      waterSurfaceHighlight.setAttribute('cy', waterY);
      waterSurfaceHighlight.setAttribute('rx', Math.max(0, waterRx - 2));
      waterSurfaceHighlight.setAttribute('ry', Math.max(0, waterRy - 1));
    }

    // Update meter fill track
    meterActive.setAttribute('y1', waterY);

    // Update the 'guess' dotted indicator
    guessText.setAttribute('y', waterY); 
    guessLine.setAttribute('y1', waterY);
    guessLine.setAttribute('y2', waterY);
    guessLine.setAttribute('x2', 250 - waterRx - 8);

    // Highlight closest tick label
    ticks.forEach(tick => {
      if (Math.abs(fillRatio - tick.val) <= 0.03) {
        tick.el.setAttribute('fill', '#f7a01d');
      } else {
        tick.el.setAttribute('fill', '#ffffff');
      }
    });
  }

  // Event listener for the slider
  slider.addEventListener('input', (e) => {
    updateWater(parseFloat(e.target.value));
  });

  // Initialize display
  updateWater(parseFloat(slider.value));
</script>

</body>
</html>
