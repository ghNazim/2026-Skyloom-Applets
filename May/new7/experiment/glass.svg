<svg width="200" height="300" viewBox="0 0 200 300">

<style>
  @keyframes fillWater {
    from { y: 250; height: 0; }
    to { y: 80; height: 170; }
  }
  .water-fill {
    animation: fillWater 4s ease-in-out infinite alternate;
  }
</style>

  <defs>
    <clipPath id="glassClip">
      <path d="M 60,50 L 70,250 Q 100,260 130,250 L 140,50 Z" />
    </clipPath>
  </defs>
  
  <!-- Animated Water Level -->
  <g clip-path="url(#glassClip)">
    <rect class="water-fill" x="40" y="250" width="120" height="0" fill="#3a9bdc" />
  </g>
  
  <!-- Glass Outline -->
  <path d="M 55,45 L 65,255 Q 100,265 135,255 L 145,45 Z" fill="none" stroke="#ccc" stroke-width="6" />
</svg>

